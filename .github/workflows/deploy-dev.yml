name: Build and Deploy Dev

on:
    push:
        branches:
            - main

jobs:
    build-and-deploy:
        name: Build, Push, and Deploy to Dev
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Check out source code
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v5
              with:
                  go-version-file: src/go.mod
                  cache: true

            - name: Set build metadata
              run: |
                  SHORT_SHA=$(git rev-parse --short HEAD)
                  echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
                  echo "VERSION=dev-${SHORT_SHA}" >> $GITHUB_ENV
                  echo "COMMIT_HASH=${SHORT_SHA}" >> $GITHUB_ENV
                  echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

            # Dev builds are signed too: with security.require_signed_binary
            # enabled, an unsigned dev binary is rejected by its own peers.
            # Skipped when BUILD_SIGN_KEY is absent, leaving buildSig empty.
            - name: Sign build attestation
              if: env.BUILD_SIGN_KEY != ''
              env:
                  BUILD_SIGN_KEY: ${{ secrets.BUILD_SIGN_KEY }}
              run: |
                  cd src
                  BUILD_SIG=$(go run ./internal/attestation/cmd/buildsign sign "${VERSION}" "${COMMIT_HASH}" "${BUILD_SIGN_KEY}")
                  echo "BUILD_SIG=${BUILD_SIG}" >> $GITHUB_ENV

            - name: Build binaries
              run: |
                  cd src
                  LDFLAGS="-X main.version=${VERSION} -X main.commitHash=${COMMIT_HASH} -X main.buildDate=${BUILD_DATE} -X main.buildSig=${BUILD_SIG}"
                  GOOS=linux GOARCH=amd64 GIN_MODE=release go build -trimpath -tags "" -ldflags "${LDFLAGS}" -o ./build/release/ ./entry/...
                  mv build/release/entry build/release/otela-amd64
                  GOOS=linux GOARCH=arm64 GIN_MODE=release go build -trimpath -tags "" -ldflags "${LDFLAGS}" -o ./build/release/ ./entry/...
                  mv build/release/entry build/release/otela-arm64
                  chmod +x build/release/otela-amd64 build/release/otela-arm64

            - name: Update dev-latest release
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release delete dev-latest --yes --cleanup-tag 2>/dev/null || true
                  gh release create dev-latest \
                    src/build/release/otela-amd64 \
                    src/build/release/otela-arm64 \
                    --title "dev-latest (${SHORT_SHA})" \
                    --notes "Latest dev build from main branch (${SHORT_SHA})" \
                    --prerelease

            - name: Prepare Docker context
              run: |
                  cp src/build/release/otela-amd64 docker/dispatcher/
                  cp src/build/release/otela-arm64 docker/dispatcher/

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6
              with:
                  context: ./docker/dispatcher
                  file: ./docker/dispatcher/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/swiss-ai/opentela:dev-${{ env.SHORT_SHA }}
                      ghcr.io/swiss-ai/opentela:latest
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Update rob-poc dev deployment
              if: env.ARGO_PAT != ''
              env:
                  ARGO_PAT: ${{ secrets.ARGO_PAT }}
              run: |
                  git clone https://x-access-token:${ARGO_PAT}@github.com/breithorn-poc/rob-poc.git /tmp/rob-poc
                  cd /tmp/rob-poc
                  sed -i "s|image: ghcr.io/swiss-ai/opentela:.*|image: ghcr.io/swiss-ai/opentela:dev-${{ env.SHORT_SHA }}|" serving-otela/dev/deployment.yaml
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add serving-otela/dev/deployment.yaml
                  git diff --cached --quiet || git commit -m "Deploy otela dev dev-${{ env.SHORT_SHA }}" && git push

            - name: Set up Python (for FirecREST upload)
              if: env.SML_FIRECREST_CLIENT_ID != ''
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
              env:
                  SML_FIRECREST_CLIENT_ID: ${{ secrets.SML_FIRECREST_CLIENT_ID }}

            - name: Install pyfirecrest
              if: env.SML_FIRECREST_CLIENT_ID != ''
              run: pip install --upgrade 'pyfirecrest>=3.7.1'
              env:
                  SML_FIRECREST_CLIENT_ID: ${{ secrets.SML_FIRECREST_CLIENT_ID }}

            - name: Publish dev binaries to CSCS ocf-share via FirecREST
              if: env.SML_FIRECREST_CLIENT_ID != ''
              env:
                  SML_FIRECREST_CLIENT_ID: ${{ secrets.SML_FIRECREST_CLIENT_ID }}
                  SML_FIRECREST_CLIENT_SECRET: ${{ secrets.SML_FIRECREST_CLIENT_SECRET }}
                  SML_FIRECREST_TOKEN_URI: ${{ secrets.SML_FIRECREST_TOKEN_URI }}
                  SML_FIRECREST_URL: ${{ secrets.SML_FIRECREST_URL }}
                  SML_FIRECREST_SYSTEM: ${{ secrets.SML_FIRECREST_SYSTEM }}
              run: |
                  python .github/scripts/upload_to_cscs.py \
                      --remote-dir /capstor/store/cscs/swissai/infra01/ocf-share/dev \
                      --symlink "otela-amd64-dev-latest-${SHORT_SHA}:otela-amd64" \
                      --symlink "otela-arm64-dev-latest-${SHORT_SHA}:otela-arm64" \
                      "src/build/release/otela-amd64:otela-amd64-dev-latest-${SHORT_SHA}" \
                      "src/build/release/otela-arm64:otela-arm64-dev-latest-${SHORT_SHA}"
